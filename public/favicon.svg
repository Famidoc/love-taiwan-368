<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#022C22" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle inner border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="106" stroke="#34D399" stroke-width="6" stroke-opacity="0.3" fill="none"/>

  <!-- Taiwan Island Silhouette (Vibrant Fresh Green) -->
  <g filter="url(#shadow)">
    <path d="M 285 70 
             C 305 85, 338 120, 348 162
             C 358 205, 352 255, 336 305
             C 320 352, 288 402, 252 442
             C 242 454, 232 452, 226 438
             C 216 412, 192 365, 178 318
             C 162 268, 158 215, 174 162
             C 190 115, 226 82, 262 65
             C 273 60, 279 63, 285 70 Z" 
          fill="url(#twGrad)" 
          stroke="#A7F3D0" 
          stroke-width="5"/>
  </g>

  <!-- Golden 368 Text overlay across center -->
  <g filter="url(#textShadow)">
    <text x="256" y="274" 
          text-anchor="middle" 
          dominant-baseline="central"
          fill="url(#goldGrad)" 
          font-family="system-ui, -apple-system, 'Noto Sans TC', sans-serif" 
          font-weight="900" 
          font-size="126" 
          letter-spacing="2"
          stroke="#78350F"
          stroke-width="4">
      368
    </text>
  </g>
</svg>
